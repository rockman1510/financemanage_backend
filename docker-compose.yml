# Local stack: PostgreSQL + backend.  docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financemanage
      POSTGRES_USER: financemanage
      POSTGRES_PASSWORD: financemanage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financemanage"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financemanage
      DB_USERNAME: financemanage
      DB_PASSWORD: financemanage
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-dev-encryption-key-change-me-0123}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@financemanage.local}
      # SMTP for verification / password reset emails (without it emails are only logged), e.g.:
      # SPRING_MAIL_HOST: smtp-relay.brevo.com
      # SPRING_MAIL_PORT: "587"
      # SPRING_MAIL_USERNAME: ...
      # SPRING_MAIL_PASSWORD: ...
      # SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    ports:
      - "8080:8080"
    volumes:
      - attachments:/app/data/attachments   # receipt photos of transactions

volumes:
  pgdata:
  attachments:
