spring:
  application:
    name: financemanage
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financemanage}
    username: ${DB_USERNAME:financemanage}
    password: ${DB_PASSWORD:financemanage}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    # every module ships its own scripts under db/migration/<module> (version ranges: common 1-99,
    # identity 100+, deposit 200+, loan 300+, notification 400+, ledger 500+, currency 600+)
    locations: classpath:db/migration
    out-of-order: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  cache:
    type: simple
    cache-names: dashboard

app:
  time-zone: Asia/Ho_Chi_Minh
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-please-32+chars}
      issuer: financemanage
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    # encrypts two-factor secrets in the database; changing it disables existing two-factor setups
    encryption-key: ${ENCRYPTION_KEY:change-me-in-production-encryption-key-32+chars}
  identity:
    login:
      max-attempts: 5
      lock-duration: PT15M
    verification:
      code-ttl: PT15M
      max-attempts: 5
      resend-cooldown: PT1M
    two-factor:
      issuer: FinanceManage
      challenge-ttl: PT5M
      max-attempts: 5
    google:
      # comma-separated OAuth client ids (web, Android, iOS); empty = Google sign-in disabled
      client-ids: ${GOOGLE_CLIENT_IDS:}
    mail:
      from: ${MAIL_FROM:no-reply@financemanage.local}
    cleanup-cron: "0 45 3 * * *"
  deposit:
    reminder-days-before: 7
    maturity-cron: "0 5 0 * * *"
  loan:
    reminder-days-before: 3
    reminder-cron: "0 15 0 * * *"
  ledger:
    recurring-cron: "0 30 0 * * *"
    attachments:
      directory: ${ATTACHMENTS_DIR:./data/attachments}
      max-size: 5MB
  currency:
    refresh-cron: "0 0 6 * * *"
  reporting:
    upcoming-days: 30
    projection-months: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
